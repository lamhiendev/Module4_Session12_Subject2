spring:
  application:
    name: product-service
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: REDIS
    redis:
      time-to-live: 1800000ms
  datasource:
    url: jdbc:postgresql://localhost:5432/product_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
server:
  port: 8081